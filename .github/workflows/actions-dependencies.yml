
name: Submit Actions Dependencies
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Weekly

permissions:
  contents: read

jobs:
  submit-dependencies:
    uses: devops-actions/.github/.github/workflows/actions-dependencies.yml@7173ecb27a93c3d22f87ff0dc735dddb189a20b3 # v1.3.0
    permissions:
      contents: write # Required for the dependency submission API
      id-token: write # Required for dependency submission
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
